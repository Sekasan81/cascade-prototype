<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>CASCADE — Mobile Systems Prototype</title>
<style>
:root{
  --bg:#0c0f14; --panel:#151a22; --panel2:#1b2230; --text:#eef3fb; --muted:#93a2b8;
  --good:#5ee68c; --warn:#ffc857; --bad:#ff6b6b; --blue:#59a6ff; --line:#50627a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%;overflow:hidden}
button{font:inherit;color:inherit}
#app{height:100dvh;display:grid;grid-template-rows:auto auto 1fr auto;background:radial-gradient(circle at 50% -20%,#1a2535 0,#0c0f14 52%)}
header{padding:12px 14px 7px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:900;letter-spacing:.14em;font-size:16px}.brand span{color:var(--blue)}
.hud{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.chip{background:#111722;border:1px solid #273244;border-radius:999px;padding:5px 8px;font-size:11px;color:#b7c5d8}.chip b{color:#fff}.risk.low b{color:var(--good)}.risk.mid b{color:var(--warn)}.risk.high b{color:var(--bad)}
#objective{margin:0 12px 7px;background:linear-gradient(90deg,#151d29,#111722);border:1px solid #273244;border-left:3px solid var(--blue);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.3;color:#c9d5e6}
main{min-height:0;display:grid;grid-template-columns:1fr;position:relative}
#boardWrap{position:relative;min-height:0;overflow:hidden;touch-action:none}
#board{width:100%;height:100%;display:block}
.edge{stroke:var(--line);stroke-width:2.2;opacity:.8}.edge.active{stroke:#a9d0ff;filter:drop-shadow(0 0 4px #59a6ff)}.edge.hidden{stroke-dasharray:5 6;opacity:.28}
.node{cursor:pointer;filter:drop-shadow(0 5px 9px #0008);transition:.15s}.node .shape{stroke:#dfe8f5;stroke-width:1.7}.node.selected .shape{stroke:#fff;stroke-width:4;filter:drop-shadow(0 0 7px currentColor)}.node text{pointer-events:none;text-anchor:middle;font-weight:900;fill:#fff}.node .nval{font-size:19px}.node .nid{font-size:9px;fill:#dbe7f7;opacity:.9}.node .stateDot{stroke:#fff;stroke-width:1}.pulse{animation:pulse .36s ease}@keyframes pulse{50%{filter:drop-shadow(0 0 16px #fff)}}
#info{position:absolute;left:10px;right:10px;bottom:8px;background:#0f141dcc;border:1px solid #273244;backdrop-filter:blur(8px);border-radius:12px;padding:8px 10px;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;pointer-events:none}.infoTitle{font-size:12px;font-weight:800}.infoSub{font-size:10px;color:var(--muted);margin-top:2px}.legend{font-size:10px;color:#9fb0c6;text-align:right}
footer{padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:#10151d;border-top:1px solid #222d3c}
.actions{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.act{border:1px solid #2b384c;background:#1a2230;border-radius:10px;padding:9px 3px;min-height:49px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:800}.act .ico{font-size:17px}.act:active{transform:scale(.97);background:#253147}.act[disabled]{opacity:.35}.act.danger{border-color:#55363a}
.bottomrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}.small{border:1px solid #2b384c;background:#151c27;border-radius:9px;padding:7px;font-size:10px;font-weight:800}.small.primary{background:#183052;border-color:#2f68a8}.small.push{background:#352619;border-color:#77562a}.small:active{transform:scale(.98)}
#logPanel{position:absolute;inset:8px 8px 74px 8px;background:#0c1119f2;border:1px solid #2a374a;border-radius:14px;padding:11px;z-index:9;display:none;overflow:auto}#logPanel.open{display:block}.logTitle{display:flex;justify-content:space-between;align-items:center;font-weight:900;margin-bottom:7px}.logEntry{font-size:11px;padding:6px 0;border-bottom:1px solid #202a38;color:#c8d4e4}.logEntry b{color:#fff}.tag{display:inline-block;border-radius:999px;padding:1px 5px;margin-right:4px;font-size:9px;background:#263248;color:#cfe0f5}
#toast{position:absolute;left:50%;top:54px;transform:translateX(-50%) translateY(-8px);background:#101722ee;border:1px solid #3b4d65;border-radius:999px;padding:7px 11px;font-size:11px;opacity:0;transition:.2s;z-index:20;pointer-events:none;white-space:nowrap}#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#modal{position:fixed;inset:0;background:#05080dbd;z-index:50;display:none;align-items:center;justify-content:center;padding:18px}#modal.open{display:flex}.card{width:min(430px,100%);background:#151b25;border:1px solid #324258;border-radius:18px;padding:18px;box-shadow:0 20px 80px #000b}.card h2{margin:0 0 7px;font-size:21px}.card p{color:#b8c5d8;font-size:13px;line-height:1.45}.card .bigScore{font-size:42px;font-weight:950;margin:8px 0}.card .buttons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.card button{border:1px solid #33445c;background:#1b2635;border-radius:11px;padding:11px;font-weight:850}.card button.primary{background:#224a78;border-color:#3a7bc1}
@media (min-width:700px){#app{max-width:520px;margin:auto;border-left:1px solid #222b38;border-right:1px solid #222b38}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="brand">CAS<span>CADE</span></div>
  <div class="hud"><div class="chip">Ходы <b id="moves">8</b></div><div class="chip">Стаб. <b id="stability">65</b>%</div><div class="chip risk low">Риск <b id="risk">12</b>%</div><div class="chip">Очки <b id="score">0</b></div></div>
</header>
<div id="objective"></div>
<main>
  <div id="boardWrap">
    <svg id="board" viewBox="0 0 400 540" preserveAspectRatio="xMidYMid meet"></svg>
    <div id="toast"></div>
    <div id="info"><div><div class="infoTitle" id="infoTitle">Выберите фигуру</div><div class="infoSub" id="infoSub">Коснитесь узла, затем примените действие.</div></div><div class="legend" id="legend">● энергия<br>◆ нестабильность</div></div>
    <div id="logPanel"><div class="logTitle">Журнал каскада <button class="small" onclick="toggleLog()">Закрыть</button></div><div id="log"></div></div>
  </div>
</main>
<footer>
  <div class="actions">
    <button class="act" data-action="scan"><span class="ico">◉</span>СКАН</button>
    <button class="act" data-action="transfer"><span class="ico">⇄</span>ПЕРЕНОС</button>
    <button class="act" data-action="amplify"><span class="ico">▲</span>УСИЛИТЬ</button>
    <button class="act" data-action="suppress"><span class="ico">▼</span>СДЕРЖАТЬ</button>
    <button class="act danger" data-action="trigger"><span class="ico">✦</span>ЗАПУСК</button>
  </div>
  <div class="bottomrow">
    <button class="small" onclick="toggleLog()">ЖУРНАЛ</button>
    <button class="small primary" onclick="newScenario()">НОВАЯ СХЕМА</button>
    <button class="small push" onclick="pushRisk()">РИСК +</button>
  </div>
</footer>
</div>
<div id="modal"><div class="card"><h2 id="modalTitle"></h2><p id="modalText"></p><div class="bigScore" id="modalScore"></div><div class="buttons"><button onclick="closeModal()">Продолжить</button><button class="primary" onclick="newScenario();closeModal()">Новая схема</button></div></div></div>
<script>
const STATES={
 stable:{name:'СТАБИЛЕН', color:'#45c97a'}, charged:{name:'ЗАРЯЖЕН',color:'#4aa3ff'}, unstable:{name:'НЕСТАБИЛЕН',color:'#ffb84d'}, critical:{name:'КРИТИЧЕН',color:'#ff6262'}, protected:{name:'ЗАЩИЩЁН',color:'#9b7cff'}, dormant:{name:'СПИТ',color:'#7a899e'}
};
const SHAPES=['circle','square','triangle','diamond','hex'];
const palette=['#2f80ed','#eb5757','#27ae60','#f2c94c','#9b51e0','#2d9cdb','#f2994a','#56ccf2'];
let game, selected=null, targetMode=null, seq=0;
const svg=document.getElementById('board');
const $=id=>document.getElementById(id);
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a}
function choose(a){return a[Math.floor(Math.random()*a.length)]}
function scenario(){
 const pos=[[200,80],[95,180],[305,180],[145,300],[255,300],[80,420],[200,440],[325,415]];
 const nodes=pos.map((p,i)=>({id:String.fromCharCode(65+i),x:p[0],y:p[1],shape:SHAPES[i%SHAPES.length],base:palette[i],state:'stable',value:rand(2,7),known:i<5,shield:0}));
 nodes[0].state='critical'; nodes[0].value=9;
 nodes[1].state='unstable'; nodes[2].state='charged'; nodes[4].state='protected'; nodes[4].shield=1; nodes[6].state='dormant';
 let edges=[[1,0],[2,0],[3,1],[4,2],[5,3],[6,3],[6,4],[7,4]];
 if(Math.random()>.5) edges.push([7,6]); else edges.push([5,6]);
 return {nodes,edges:edges.map((e,i)=>({a:e[0],b:e[1],known:i<6})),moves:8,risk:rand(10,22),stability:65,score:0,mult:1,objective:'Стабилизируйте красный CORE (A): переведите его из КРИТИЧЕН в СТАБИЛЕН до конца ходов.',done:false,log:[]};
}
function newScenario(){game=scenario();selected=null;targetMode=null;seq++; log('СИСТЕМА','Новая конфигурация создана. Найдите безопасную цепь к CORE A.'); render()}
function log(tag,text){game.log.unshift({tag,text});if(game.log.length>30)game.log.pop();renderLog()}
function renderLog(){if(!game)return;$('log').innerHTML=game.log.map(x=>`<div class="logEntry"><span class="tag">${x.tag}</span>${x.text}</div>`).join('')}
function riskClass(){return game.risk<35?'low':game.risk<65?'mid':'high'}
function shapeEl(n){const s=28; if(n.shape==='circle')return `<circle class="shape" cx="${n.x}" cy="${n.y}" r="${s}" fill="${n.base}"/>`;if(n.shape==='square')return `<rect class="shape" x="${n.x-s}" y="${n.y-s}" width="${s*2}" height="${s*2}" rx="7" fill="${n.base}"/>`;if(n.shape==='diamond')return `<polygon class="shape" points="${n.x},${n.y-s-3} ${n.x+s+3},${n.y} ${n.x},${n.y+s+3} ${n.x-s-3},${n.y}" fill="${n.base}"/>`;if(n.shape==='triangle')return `<polygon class="shape" points="${n.x},${n.y-s-6} ${n.x+s+5},${n.y+s} ${n.x-s-5},${n.y+s}" fill="${n.base}"/>`;return `<polygon class="shape" points="${n.x-25},${n.y-15} ${n.x},${n.y-30} ${n.x+25},${n.y-15} ${n.x+25},${n.y+15} ${n.x},${n.y+30} ${n.x-25},${n.y+15}" fill="${n.base}"/>`}
function render(){
 $('moves').textContent=game.moves;$('stability').textContent=Math.max(0,game.stability);$('risk').textContent=Math.min(100,game.risk);$('score').textContent=Math.round(game.score);document.querySelector('.risk').className='chip risk '+riskClass();$('objective').textContent=game.objective;
 let html=''; game.edges.forEach((e,i)=>{let a=game.nodes[e.a],b=game.nodes[e.b];html+=`<line class="edge ${e.known?'':'hidden'}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`});
 game.nodes.forEach((n,i)=>{let state=STATES[n.state];html+=`<g class="node ${selected===i?'selected':''}" data-i="${i}" style="color:${state.color}">${shapeEl(n)}<circle class="stateDot" cx="${n.x+21}" cy="${n.y-22}" r="6" fill="${state.color}"/><text class="nval" x="${n.x}" y="${n.y+6}">${n.value}</text><text class="nid" x="${n.x}" y="${n.y+22}">${n.id}</text></g>`});
 svg.innerHTML=html; svg.querySelectorAll('.node').forEach(el=>el.addEventListener('click',()=>selectNode(+el.dataset.i)));
 updateInfo(); [...document.querySelectorAll('.act')].forEach(b=>b.disabled=game.done||game.moves<=0); checkEnd();
}
function selectNode(i){if(game.done)return;if(targetMode){performTransfer(targetMode,i);return} selected=i;render()}
function updateInfo(){if(selected===null){$('infoTitle').textContent='Выберите фигуру';$('infoSub').textContent='Коснитесь узла, затем примените действие.';return}let n=game.nodes[selected],s=STATES[n.state];$('infoTitle').textContent=`${n.id} · ${s.name} · сила ${n.value}`;$('infoSub').textContent=n.known?`Форма: ${n.shape}. Связей известно: ${game.edges.filter(e=>e.known&&(e.a===selected||e.b===selected)).length}`:'Свойства скрыты. СКАН откроет данные.'}
function spend(cost=1){if(game.moves<cost){toast('Нет ходов');return false}game.moves-=cost;return true}
function toast(t){let el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1100)}
function adjacent(i){return game.edges.filter(e=>e.a===i||e.b===i).map(e=>e.a===i?e.b:e.a)}
function cascade(start,reason){let q=[start],seen=new Set(),count=0;while(q.length&&count<12){let i=q.shift();if(seen.has(i))continue;seen.add(i);let n=game.nodes[i];
   if(n.state==='critical'){for(const j of adjacent(i)){let m=game.nodes[j];if(m.state==='charged'||m.state==='unstable'){m.value=Math.max(0,m.value-1);count++;log('КАСКАД',`${n.id} тянет энергию из ${m.id}: ${m.id} −1.`);if(m.value<=2)m.state='stable';}}
   }
   if(n.state==='unstable'&&n.value>=7){n.state='critical';game.stability-=8;game.risk+=8;count++;log('КАСКАД',`${n.id} сорвался в КРИТИЧЕН. Стабильность −8.`);adjacent(i).forEach(j=>q.push(j));}
   if(n.state==='charged'&&n.value>=8){n.state='unstable';game.risk+=5;count++;log('КАСКАД',`${n.id} перегружен и стал НЕСТАБИЛЕН.`);adjacent(i).forEach(j=>q.push(j));}
   if(n.state==='protected'&&n.shield<=0){n.state='stable';count++;log('КАСКАД',`Защита ${n.id} снята.`)}
 }
 if(count){game.score+=count*40*game.mult;toast(`Каскад ×${count}`)}
 pulse(start);return count}
function pulse(i){setTimeout(()=>{let el=svg.querySelector(`[data-i="${i}"]`);if(el){el.classList.add('pulse');setTimeout(()=>el.classList.remove('pulse'),380)}},20)}
function action(type){if(selected===null){toast('Сначала выберите фигуру');return}let n=game.nodes[selected];
 if(type==='scan'){if(!spend())return;n.known=true;let hidden=game.edges.filter(e=>!e.known&&(e.a===selected||e.b===selected));if(hidden.length){hidden[0].known=true;game.score+=25;log('СКАН',`${n.id}: обнаружена скрытая связь.`)}else{n.value=Math.min(9,n.value+0);log('СКАН',`${n.id}: скрытых связей рядом не найдено.`)}game.risk=Math.max(0,game.risk-2)}
 if(type==='amplify'){if(!spend())return;n.value=Math.min(9,n.value+2);game.risk+=7;log('УСИЛЕНИЕ',`${n.id}: сила +2 → ${n.value}. Риск +7.`);if(n.state==='stable')n.state='charged';else if(n.state==='charged'&&n.value>=8)n.state='unstable';cascade(selected,'amplify')}
 if(type==='suppress'){if(!spend())return;n.value=Math.max(0,n.value-2);game.risk=Math.max(0,game.risk-5);game.stability=Math.min(100,game.stability+4);if(n.state==='critical'&&n.value<=5)n.state='unstable';else if(n.state==='unstable'&&n.value<=4)n.state='stable';else if(n.state==='charged'&&n.value<=3)n.state='stable';if(n.state==='protected'){n.shield=Math.max(0,n.shield-1)}log('СДЕРЖИВАНИЕ',`${n.id}: сила −2 → ${n.value}. Стабильность +4.`);cascade(selected,'suppress')}
 if(type==='trigger'){if(!spend())return;game.risk+=12;log('ЗАПУСК',`${n.id}: принудительная активация.`);if(n.state==='dormant'){n.state='charged';n.value+=2}else if(n.state==='charged'){n.value=Math.min(9,n.value+3)}else if(n.state==='unstable'){n.state='critical';game.stability-=10}else if(n.state==='critical'){for(const j of adjacent(selected)){let m=game.nodes[j];m.value=Math.max(0,m.value-2);if(m.state==='stable')m.state='charged'}game.stability-=12}cascade(selected,'trigger')}
 if(type==='transfer'){if(!spend())return;targetMode=selected;toast('Выберите соседний узел');log('ПЕРЕНОС',`Источник ${n.id} выбран. Укажите соседнюю фигуру.`);render();return}
 render()}
function performTransfer(from,to){let a=game.nodes[from],b=game.nodes[to];targetMode=null;if(!adjacent(from).includes(to)){game.moves+=1;toast('Нужна прямая связь');log('ОШИБКА',`${a.id} и ${b.id} не соединены. Ход возвращён.`);selected=to;render();return}let amount=Math.min(2,a.value);a.value-=amount;b.value=Math.min(9,b.value+amount);if(b.state==='stable'&&b.value>=6)b.state='charged';if(a.state==='critical'&&a.value<=5)a.state='unstable';game.risk+=3;log('ПЕРЕНОС',`${a.id} → ${b.id}: ${amount} энергии.`);selected=to;cascade(to,'transfer');render()}
function pushRisk(){if(game.done)return;if(game.moves<=0){toast('Нет ходов');return}game.risk=Math.min(100,game.risk+15);game.mult=Math.min(4,game.mult+.5);game.moves+=1;log('РИСК',`Вы получили +1 ход. Множитель ×${game.mult.toFixed(1)}, риск +15.`);toast(`×${game.mult.toFixed(1)} · +1 ход`);render()}
function checkEnd(){if(game.done)return;let core=game.nodes[0];if(core.state==='stable'){game.done=true;game.score+=Math.max(0,game.moves)*80+Math.max(0,game.stability)*5;openModal('СХЕМА СТАБИЛЬНА',`CORE A стабилизирован. Оставшиеся ходы и стабильность превратились в бонус. Максимальный интерес теперь — найти решение с меньшим риском и более длинной полезной цепью.`,Math.round(game.score));return}if(game.stability<=0||game.risk>=100){game.done=true;openModal('СИСТЕМА РАЗРУШЕНА',`Вы перешли предел управляемости. Это полезный результат теста: риск должен ощущаться как добровольное давление, а не случайное наказание.`,Math.round(game.score));return}if(game.moves<=0){game.done=true;openModal('ХОДЫ ЗАКОНЧИЛИСЬ',`CORE A ещё нестабилен. Попробуйте другой порядок: сначала вскройте связи, затем перераспределяйте энергию.`,Math.round(game.score))}}
function openModal(t,txt,score){$('modalTitle').textContent=t;$('modalText').textContent=txt;$('modalScore').textContent=score+' pts';$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
function toggleLog(){$('logPanel').classList.toggle('open')}
document.querySelectorAll('.act').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action)));
newScenario();
</script>
</body></html>
